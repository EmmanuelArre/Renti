name: renti
description: "Renti: rentas de vivienda para estudiantes (Flutter, Firebase y SQLite)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.3.0
  sqflite: ^2.4.2
  path: ^1.9.0
  image_picker: ^1.1.2
  image: ^4.5.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
